name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build bundle
        run: linux/package.sh "$GITHUB_REF_NAME" dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/printer-proxy-linux-arm64.tar.gz
            dist/printer-proxy-linux-arm64.tar.gz.sha256
